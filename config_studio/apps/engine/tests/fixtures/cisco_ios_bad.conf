!
! Bad Cisco IOS config — multiple security and semantic issues for testing
!
version 15.2
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname BAD-ROUTER
!
enable password cisco123
!
ip source-route
ip classless
ip subnet-zero
!
no aaa new-model
!
interface GigabitEthernet0/0
 description WAN uplink
 ip address 203.0.113.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/1
 description Internal LAN
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 no ip address
 no description
!
interface Port-channel1
 description Server trunk
!
interface GigabitEthernet1/0
 channel-group 1 mode active
 speed 1000
 duplex full
!
interface GigabitEthernet1/1
 channel-group 1 mode active
 speed 100
 duplex half
!
router ospf 1
 network 10.1.1.0 0.0.0.255 area 0
 network 10.1.1.0 0.0.0.255 area 1
!
router bgp 65001
 neighbor 10.2.2.2 remote-as 65002
 neighbor 10.2.2.2 peer-group UNDEFINED-GROUP
 neighbor 10.2.2.2 route-map NONEXISTENT-RM in
!
ip access-list extended UNUSED-ACL
 permit ip 10.0.0.0 0.255.255.255 any
 deny ip any any
 permit ip host 1.2.3.4 any
!
ip route 0.0.0.0 0.0.0.0 Loopback99
!
vlan 10
 name SERVERS
!
interface GigabitEthernet0/3
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30
 switchport trunk native vlan 1
!
snmp-server community public RO
snmp-server community private RW
!
ip http server
!
line con 0
 password 0 console123
!
line aux 0
 no login
!
line vty 0 4
 transport input telnet
 password 7 045802150C2E
!
end
