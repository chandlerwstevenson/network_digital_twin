version 21.4R3;
system {
    host-name GOOD-JUNOS;
    root-authentication {
        encrypted-password "$6$abc123$longhashvalue";
    }
    login {
        message "Authorized access only. All activity is logged.";
        class admin {
            permissions all;
        }
        user netadmin {
            class admin;
            authentication {
                encrypted-password "$6$xyz789$anotherhash";
            }
        }
    }
    services {
        ssh {
            protocol-version v2;
            rate-limit 5;
        }
    }
    syslog {
        host 10.1.1.200 {
            any notice;
            authorization info;
        }
        file messages {
            any notice;
        }
    }
    ntp {
        server 10.1.1.100;
        server 10.1.1.101;
    }
    authentication-order [ tacplus password ];
    tacplus-server {
        10.1.1.50 {
            secret "$9$encryptedkey";
        }
    }
}
interfaces {
    ge-0/0/0 {
        description "WAN-UPLINK-TO-ISP";
        unit 0 {
            family inet {
                filter {
                    input protect-RE;
                }
                address 203.0.113.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                filter {
                    input protect-RE;
                }
                address 1.1.1.1/32;
            }
        }
    }
}
snmp {
    community "S3cureStr1ng" {
        authorization read-only;
        clients {
            10.1.1.0/24;
        }
    }
}
firewall {
    filter protect-RE {
        term allow-ssh {
            from {
                source-address 10.1.1.0/24;
                protocol tcp;
                destination-port ssh;
            }
            then accept;
        }
        term deny-all {
            then {
                discard;
            }
        }
    }
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface ge-0/0/0;
            interface lo0.0 {
                passive;
            }
        }
    }
}
