!
! Well-configured Cisco IOS router — minimal findings expected
!
version 15.7
service timestamps debug datetime msec localtime
service timestamps log datetime msec localtime
service password-encryption
no service pad
!
hostname GOOD-ROUTER
!
enable algorithm-type scrypt secret 9 $9$abc123def456
!
aaa new-model
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
!
no ip source-route
no ip finger
!
ip ssh version 2
ip ssh time-out 60
ip ssh authentication-retries 3
!
interface GigabitEthernet0/0
 description WAN-UPLINK-TO-ISP-CKT-12345
 ip address 203.0.113.1 255.255.255.0
 ip access-group WAN-INBOUND in
 no shutdown
!
interface GigabitEthernet0/1
 description INTERNAL-LAN-SERVERS
 ip address 10.1.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description UNUSED
 shutdown
!
router ospf 1
 router-id 1.1.1.1
 network 10.1.1.0 0.0.0.255 area 0
 network 203.0.113.0 0.0.0.255 area 0
!
ip access-list extended WAN-INBOUND
 permit tcp any host 203.0.113.1 eq 22
 deny ip any any log
!
ip route 0.0.0.0 0.0.0.0 203.0.113.254
!
snmp-server community S3cureStr1ng! RO MGMT-ACL
!
ip http secure-server
no ip http server
!
ntp server 10.1.1.100
ntp server 10.1.1.101
!
logging host 10.1.1.200
logging trap informational
!
banner login ^
**********************************************
* Authorized access only. All activity logged *
**********************************************
^
!
control-plane
 service-policy input CoPP-Policy
!
line con 0
 exec-timeout 10 0
 login authentication default
!
line aux 0
 exec-timeout 0 1
 login authentication default
 transport input none
!
line vty 0 4
 exec-timeout 10 0
 transport input ssh
 access-class MGMT-ACL in
 login authentication default
!
end
