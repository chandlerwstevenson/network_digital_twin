router ospf
 ospf router-id 10.0.1.1
 network 10.0.1.1/32 area 0
 network 192.168.1.0/24 area 0
!
interface eth1
 ip address 10.255.1.1/24
 ip ospf area 0
 ip ospf authentication
!
interface eth2
 ip address 10.255.2.1/24
 ip ospf area 0
 ip ospf authentication
!
interface lo
 ip address 10.0.1.1/32
!
