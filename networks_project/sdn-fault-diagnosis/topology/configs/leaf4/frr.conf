frr defaults traditional
hostname leaf4
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.4/32
!
interface eth1
 description "Link to spine1"
 ip address 10.1.1.7/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth2
 description "Link to spine2"
 ip address 10.1.2.7/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth3
 description "Link to spine3"
 ip address 10.1.3.7/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth4
 description "Link to spine4"
 ip address 10.1.4.7/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth5
 description "Host network - host7"
 ip address 192.168.4.1/24
!
interface eth6
 description "Host network - host8"
 ip address 192.168.4.2/24
!
router ospf
 ospf router-id 10.0.1.4
 log-adjacency-changes detail
 network 10.0.1.4/32 area 0
 network 10.1.1.6/31 area 0
 network 10.1.2.6/31 area 0
 network 10.1.3.6/31 area 0
 network 10.1.4.6/31 area 0
 network 192.168.4.0/24 area 0
!
line vty
!
