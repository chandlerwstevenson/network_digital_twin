frr defaults traditional
hostname leaf2
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.0.1.2/32
!
interface eth1
 description "Link to spine1"
 ip address 10.1.1.3/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth2
 description "Link to spine2"
 ip address 10.1.2.3/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth3
 description "Link to spine3"
 ip address 10.1.3.3/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth4
 description "Link to spine4"
 ip address 10.1.4.3/31
 ip ospf network point-to-point
 ip ospf hello-interval 10
 ip ospf dead-interval 40
!
interface eth5
 description "Host network - host3"
 ip address 192.168.2.1/24
!
interface eth6
 description "Host network - host4"
 ip address 192.168.2.2/24
!
router ospf
 ospf router-id 10.0.1.2
 log-adjacency-changes detail
 network 10.0.1.2/32 area 0
 network 10.1.1.2/31 area 0
 network 10.1.2.2/31 area 0
 network 10.1.3.2/31 area 0
 network 10.1.4.2/31 area 0
 network 192.168.2.0/24 area 0
!
line vty
!
