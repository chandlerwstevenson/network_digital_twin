# Containerlab Topology: Spine-Leaf Network for SDN Fault Diagnosis
# 4 Spines, 4 Leafs
# Full mesh between spine and leaf tiers
# Simplified for macOS/Docker Desktop compatibility

name: sdn-fault-diagnosis

topology:
  kinds:
    linux:
      image: frrouting/frr:latest

  nodes:
    # Spine routers
    spine1:
      kind: linux
      binds:
        - configs/spine1/frr.conf:/etc/frr/frr.conf
        - configs/spine1/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    spine2:
      kind: linux
      binds:
        - configs/spine2/frr.conf:/etc/frr/frr.conf
        - configs/spine2/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    spine3:
      kind: linux
      binds:
        - configs/spine3/frr.conf:/etc/frr/frr.conf
        - configs/spine3/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    spine4:
      kind: linux
      binds:
        - configs/spine4/frr.conf:/etc/frr/frr.conf
        - configs/spine4/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    # Leaf routers
    leaf1:
      kind: linux
      binds:
        - configs/leaf1/frr.conf:/etc/frr/frr.conf
        - configs/leaf1/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    leaf2:
      kind: linux
      binds:
        - configs/leaf2/frr.conf:/etc/frr/frr.conf
        - configs/leaf2/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    leaf3:
      kind: linux
      binds:
        - configs/leaf3/frr.conf:/etc/frr/frr.conf
        - configs/leaf3/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

    leaf4:
      kind: linux
      binds:
        - configs/leaf4/frr.conf:/etc/frr/frr.conf
        - configs/leaf4/daemons:/etc/frr/daemons
      exec:
        - touch /etc/frr/vtysh.conf
        - /usr/lib/frr/frrinit.sh start

  links:
    # Spine1 to all Leafs (eth1-eth4)
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine1:eth3", "leaf3:eth1"]
    - endpoints: ["spine1:eth4", "leaf4:eth1"]

    # Spine2 to all Leafs (eth1-eth4)
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["spine2:eth3", "leaf3:eth2"]
    - endpoints: ["spine2:eth4", "leaf4:eth2"]

    # Spine3 to all Leafs (eth1-eth4)
    - endpoints: ["spine3:eth1", "leaf1:eth3"]
    - endpoints: ["spine3:eth2", "leaf2:eth3"]
    - endpoints: ["spine3:eth3", "leaf3:eth3"]
    - endpoints: ["spine3:eth4", "leaf4:eth3"]

    # Spine4 to all Leafs (eth1-eth4)
    - endpoints: ["spine4:eth1", "leaf1:eth4"]
    - endpoints: ["spine4:eth2", "leaf2:eth4"]
    - endpoints: ["spine4:eth3", "leaf3:eth4"]
    - endpoints: ["spine4:eth4", "leaf4:eth4"]
